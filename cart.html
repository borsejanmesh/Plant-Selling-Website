<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - GreenGrow</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">🌱 GreenGrow</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-icons">
                    <button id="theme-toggle" class="theme-toggle" title="Switch Theme">🌙</button>
                    <a href="cart.html" class="cart-icon">
                        🛒 <span class="cart-count">0</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <section class="cart-page">
        <div class="container">
            <h2 class="section-title">Shopping Cart</h2>
            <div class="cart-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Cart items injected by JS -->
                    </tbody>
                </table>

                <div class="cart-summary">
                    <div class="summary-card">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="cart-subtotal">₹0</span>
                        </div>
                        <div class="summary-row summary-total">
                            <span>Total</span>
                            <span id="cart-total">₹0</span>
                        </div>
                        <button class="btn btn-primary" style="width: 100%; margin-top: 15px;"
                            onclick="alert('Checkout functionality not implemented (Frontend Demo)')">Proceed to
                            Checkout</button>
                        <button class="btn btn-outline" style="width: 100%; margin-top: 10px;"
                            onclick="clearCart()">Clear Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="copyright">
                <p>&copy; 2024 GreenGrow. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
